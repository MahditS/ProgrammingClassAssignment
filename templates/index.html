<!DOCTYPE html>
<html>

<head>
    <title>JohalTunes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <div class="header">
        <h1>&#127911; JohalTunes</h1>
        <div>
            <button class="reset-btn" onclick="openProfile()">Profile</button>
            <button class="reset-btn" onclick="openAdmin()">Admin</button>
            <button class="reset-btn" onclick="resetApp()">Reset App</button>
        </div>
    </div>

    <div class="music-container">

        <div class="track-list">

            <div class="track-header">
                <h2>Tracks</h2>

                <select id="filterSelect" onchange="renderTracks()">
                    <option value="all">All Songs</option>
                    <option value="liked">Liked Songs</option>
                </select>
            </div>

            <div id="tracksContainer"></div>

        </div>

        <div class="queue">

            <h2>Queue</h2>

            <ul id="queueList"></ul>

        </div>

    </div>

    <div id="overlayBackdrop" class="overlay-backdrop" onclick="closePlaylistFormBackdrop(event)"></div>
    <div id="overlayForm" class="overlay-form"></div>

    <div id="profileModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">
        <div style="background:#222; margin:8% auto; padding:24px; border-radius:10px; width:90%; max-width:420px; color:white; position:relative;">
            <button onclick="closeProfile()" style="position:absolute; top:12px; right:14px; background:none; border:none; color:#aaa; font-size:22px; cursor:pointer;">x</button>
            <div id="profileContent"></div>
        </div>
    </div>

    <div id="adminModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">
        <div style="background:#222; margin:8% auto; padding:24px; border-radius:10px; width:90%; max-width:560px; color:white; position:relative;">
            <button onclick="closeAdmin()" style="position:absolute; top:12px; right:14px; background:none; border:none; color:#aaa; font-size:22px; cursor:pointer;">x</button>
            <div id="adminContent"></div>
        </div>
    </div>

    <div id="generateModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">
        <div style="background:#222; margin:8% auto; padding:24px; border-radius:10px; width:90%; max-width:480px; color:white; position:relative; max-height:80vh; overflow-y:auto;">
            <button onclick="closeGenerate()" style="position:absolute; top:12px; right:14px; background:none; border:none; color:#aaa; font-size:22px; cursor:pointer;">x</button>
            <div id="generateContent"></div>
        </div>
    </div>

    <div class="player">

        <audio id="audioPlayer" controls>
            Your browser does not support audio.
        </audio>

        <div class="controls">

            <button onclick="playNext()">
                Next &#9654;
            </button>

            <button onclick="clearQueue()">
                Clear Queue
            </button>

            <button class="reset-btn" onclick="openGenerate()">
                Generate Playlist
            </button>

            <a href="/logout">
                Logout
            </a>

        </div>

    </div>

</div>

<script>

let queue = [];
let currentIndex = -1;
const tracks = {{ tracks | tojson }};
const songLibrary = {{ song_library | tojson }};

let likedSongs = JSON.parse(localStorage.getItem("likedSongs")) || [];
let playlists  = JSON.parse(localStorage.getItem("playlists"))  || [];


function renderTracks() {

    const container = document.getElementById("tracksContainer");
    const filterElement = document.getElementById("filterSelect");
    const currentValue = filterElement.value;

    filterElement.innerHTML = `
        <option value="all">All Songs</option>
        <option value="liked">Liked Songs</option>
    `;

    playlists.forEach(playlist => {
        const op = document.createElement("option");
        op.value = playlist;
        op.textContent = playlist;
        filterElement.appendChild(op);
    });

    filterElement.value = currentValue;

    const filter = document.getElementById("filterSelect").value;

    container.innerHTML = "";

    let filteredTracks = tracks;

    if (filter === "liked") {
        filteredTracks = tracks.filter(track => likedSongs.includes(track.id));
    } else if (filter !== "all") {
        let f = JSON.parse(localStorage.getItem(filter)) || [];
        filteredTracks = tracks.filter(track => f.includes(track.id));
    }

    filteredTracks.forEach(track => {

        const div = document.createElement("div");
        div.className = "track";

        const songName = document.createElement("span");
        songName.textContent = track.name;
        songName.onclick = () => addToQueue(track.id, track.name);

        const likeBtn = document.createElement("button");
        likeBtn.innerHTML = likedSongs.includes(track.id) ? "&#10084;" : "&#129293;";
        likeBtn.onclick = (e) => {
            e.stopPropagation();
            toggleLike(track.id);
        };

        const playlistBtn = document.createElement("button");
        playlistBtn.innerHTML = "+";
        playlistBtn.onclick = (e) => {
            e.stopPropagation();
            playListAdder(track.id, track.name);
        };

        div.appendChild(songName);
        div.appendChild(likeBtn);
        div.appendChild(playlistBtn);
        container.appendChild(div);
    });
}

function closePlaylistForm() {
    document.getElementById("overlayForm").innerHTML = "";
    document.getElementById("overlayBackdrop").style.display = "none";
}

function closePlaylistFormBackdrop(event) {
    if (event.target === event.currentTarget) {
        closePlaylistForm();
    }
}

function playListAdder(trackId, trackName) {

    const container  = document.getElementById("overlayForm");
    const backdrop   = document.getElementById("overlayBackdrop");
    container.innerHTML = "";
    backdrop.style.display = "block";

    const formContent = document.createElement("div");
    formContent.className = "playlist-form-content";
    formContent.onclick = (e) => e.stopPropagation();

    const title = document.createElement("h3");
    title.textContent = "Add to Playlist";
    formContent.appendChild(title);

    const playlistList = document.createElement("div");
    playlistList.className = "playlist-list";

    playlists.forEach(playlist => {
        const div = document.createElement("div");
        div.className = "playlist-item";
        const playListName = document.createElement("span");
        playListName.textContent = playlist;
        div.style.cursor = "pointer";
        div.onclick = () => {
            addToPlaylist(trackId, trackName, playlist);
            closePlaylistForm();
        };
        div.appendChild(playListName);
        playlistList.appendChild(div);
    });

    formContent.appendChild(playlistList);

    const inputContainer = document.createElement("div");
    inputContainer.className = "input-group";

    const input = document.createElement("input");
    input.type = "text";
    input.name = "playlistName";
    input.placeholder = "New Playlist Name";

    const create = document.createElement("button");
    create.className = "create-btn";
    create.textContent = "Create";
    create.onclick = (e) => {
        e.stopPropagation();
        const name = input.value.trim();
        if (name === "") return;
        if (!playlists.includes(name)) {
            playlists.push(name);
            localStorage.setItem("playlists", JSON.stringify(playlists));
            localStorage.setItem(name, JSON.stringify([]));
        }
        addToPlaylist(trackId, trackName, name);
        closePlaylistForm();
        renderTracks();
    };

    inputContainer.appendChild(input);
    inputContainer.appendChild(create);
    formContent.appendChild(inputContainer);

    const close = document.createElement("button");
    close.className = "close-btn";
    close.textContent = "Close";
    close.onclick = () => closePlaylistForm();
    formContent.appendChild(close);

    container.appendChild(formContent);
}

function addToPlaylist(trackId, trackName, playListName) {
    let playlist = JSON.parse(localStorage.getItem(playListName)) || [];
    if (playlist.includes(trackId)) {
        playlist = playlist.filter(id => id !== trackId);
    } else {
        playlist.push(trackId);
    }
    localStorage.setItem(playListName, JSON.stringify(playlist));
    renderTracks();
}


function toggleLike(trackId) {
    if (likedSongs.includes(trackId)) {
        likedSongs = likedSongs.filter(id => id !== trackId);
    } else {
        likedSongs.push(trackId);
    }
    localStorage.setItem("likedSongs", JSON.stringify(likedSongs));
    renderTracks();
}


function addToQueue(id, name) {
    queue.push({ id, name });
    updateQueueUI();
    if (queue.length === 1) {
        playTrack(0);
    }
}

function updateQueueUI() {
    const list = document.getElementById("queueList");
    list.innerHTML = "";
    queue.forEach((track, index) => {
        const li = document.createElement("li");
        li.textContent = track.name;
        if (index === currentIndex) {
            li.style.fontWeight = "bold";
        }
        list.appendChild(li);
    });
}

function playTrack(index) {
    if (index < 0 || index >= queue.length) return;
    currentIndex = index;
    const track = queue[index];
    const audio = document.getElementById("audioPlayer");
    audio.src = `/track/${track.id}`;
    audio.play();
    updateQueueUI();
}

function playNext() {
    if (currentIndex + 1 >= queue.length) return;
    playTrack(currentIndex + 1);
}

function clearQueue() {
    queue = [];
    currentIndex = -1;
    const audio = document.getElementById("audioPlayer");
    audio.pause();
    audio.src = "";
    updateQueueUI();
}

function resetApp() {
    if (confirm("Are you sure you want to reset the app? This will clear all playlists and liked songs.")) {
        localStorage.clear();
        likedSongs = [];
        playlists = [];
        queue = [];
        currentIndex = -1;
        const audio = document.getElementById("audioPlayer");
        audio.pause();
        audio.src = "";
        renderTracks();
        updateQueueUI();
        closePlaylistForm();
    }
}

document.getElementById("audioPlayer").addEventListener("ended", () => {
    queue.splice(currentIndex, 1);
    if (queue.length > 0) {
        if (currentIndex >= queue.length) {
            currentIndex = queue.length - 1;
        }
        playTrack(currentIndex);
    } else {
        currentIndex = -1;
        updateQueueUI();
    }
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        closePlaylistForm();
        closeProfile();
        closeAdmin();
        closeGenerate();
    }
});


function openProfile() {
    fetch("/api/user/profile")
        .then(r => r.json())
        .then(data => {
            const c = document.getElementById("profileContent");
            if (!data.name) {
                c.innerHTML = `
                    <h2>Create Profile</h2>
                    <p><label>Name<br><input id="pName" type="text" style="width:100%;padding:6px;margin-top:4px;background:#333;border:1px solid #555;color:white;border-radius:4px;"></label></p>
                    <p><label>Date of Birth<br><input id="pDob" type="date" style="width:100%;padding:6px;margin-top:4px;background:#333;border:1px solid #555;color:white;border-radius:4px;"></label></p>
                    <p><label>Favourite Artist<br><input id="pArtist" type="text" style="width:100%;padding:6px;margin-top:4px;background:#333;border:1px solid #555;color:white;border-radius:4px;"></label></p>
                    <p><label>Favourite Genre<br><input id="pGenre" type="text" style="width:100%;padding:6px;margin-top:4px;background:#333;border:1px solid #555;color:white;border-radius:4px;"></label></p>
                    <button onclick="saveProfile()" style="margin-top:10px;padding:8px 18px;background:#1db954;border:none;color:white;border-radius:4px;cursor:pointer;">Save</button>`;
            } else {
                c.innerHTML = `
                    <h2>Profile</h2>
                    <p><strong>Name:</strong> ${data.name}</p>
                    <p><strong>Date of Birth:</strong> ${data.dob}</p>
                    <p><strong>Favourite Artist:</strong> ${data.favourite_artist}</p>
                    <p><strong>Favourite Genre:</strong> ${data.favourite_genre}</p>
                    <hr style="border-color:#444;margin:14px 0;">
                    <h3>Edit Preferences</h3>
                    <p><label>Favourite Artist<br><input id="pArtistEdit" type="text" value="${data.favourite_artist}" style="width:100%;padding:6px;margin-top:4px;background:#333;border:1px solid #555;color:white;border-radius:4px;"></label></p>
                    <p><label>Favourite Genre<br><input id="pGenreEdit" type="text" value="${data.favourite_genre}" style="width:100%;padding:6px;margin-top:4px;background:#333;border:1px solid #555;color:white;border-radius:4px;"></label></p>
                    <button onclick="updateProfile()" style="margin-top:10px;padding:8px 18px;background:#1db954;border:none;color:white;border-radius:4px;cursor:pointer;">Update</button>`;
            }
            document.getElementById("profileModal").style.display = "block";
        });
}

function closeProfile() {
    document.getElementById("profileModal").style.display = "none";
}

function saveProfile() {
    const body = {
        name:             document.getElementById("pName").value,
        dob:              document.getElementById("pDob").value,
        favourite_artist: document.getElementById("pArtist").value,
        favourite_genre:  document.getElementById("pGenre").value
    };
    fetch("/api/user/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    }).then(() => closeProfile());
}

function updateProfile() {
    const body = {
        favourite_artist: document.getElementById("pArtistEdit").value,
        favourite_genre:  document.getElementById("pGenreEdit").value
    };
    fetch("/api/user/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    }).then(() => closeProfile());
}


function openAdmin() {
    document.getElementById("adminContent").innerHTML = "<p>Loading...</p>";
    document.getElementById("adminModal").style.display = "block";
    fetch("/api/admin/genres-stats")
        .then(r => r.json())
        .then(stats => {
            let html = "<h2>Genre Statistics</h2><table style='width:100%;border-collapse:collapse;'>";
            html += "<tr style='border-bottom:1px solid #555;'><th style='text-align:left;padding:8px;'>Genre</th><th style='text-align:left;padding:8px;'>Avg Length</th><th style='text-align:left;padding:8px;'>Songs</th></tr>";
            stats.forEach(s => {
                html += `<tr style='border-bottom:1px solid #333;'><td style='padding:8px;'>${s.genre}</td><td style='padding:8px;'>${s.average_length}</td><td style='padding:8px;'>${s.song_count}</td></tr>`;
            });
            html += "</table>";
            document.getElementById("adminContent").innerHTML = html;
        });
}

function closeAdmin() {
    document.getElementById("adminModal").style.display = "none";
}


function openGenerate() {
    const genres = [...new Set(songLibrary.map(s => s.genre))].sort();
    let genreOptions = genres.map(g => `<option value="${g}">${g}</option>`).join("");

    document.getElementById("generateContent").innerHTML = `
        <h2>Generate Playlist</h2>

        <h3>By Time Limit</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input id="genMinutes" type="number" min="1" value="10" style="width:70px;padding:6px;background:#333;border:1px solid #555;color:white;border-radius:4px;">
            <span>minutes</span>
            <button onclick="generateByTime()" style="padding:6px 14px;background:#1db954;border:none;color:white;border-radius:4px;cursor:pointer;">Generate</button>
        </div>
        <div id="timeResult" style="margin-top:10px;"></div>

        <hr style="border-color:#444;margin:16px 0;">

        <h3>By Genre</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <select id="genGenre" style="padding:6px;background:#333;border:1px solid #555;color:white;border-radius:4px;">
                <option value="">-- Select genre --</option>
                ${genreOptions}
            </select>
            <button onclick="generateByGenre()" style="padding:6px 14px;background:#1db954;border:none;color:white;border-radius:4px;cursor:pointer;">Generate</button>
        </div>
        <div id="genreResult" style="margin-top:10px;"></div>

        <hr style="border-color:#444;margin:16px 0;">

        <h3>Export Artist to Text File</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input id="genArtist" type="text" placeholder="Artist name" style="flex:1;padding:6px;background:#333;border:1px solid #555;color:white;border-radius:4px;">
            <button onclick="exportArtist()" style="padding:6px 14px;background:#1db954;border:none;color:white;border-radius:4px;cursor:pointer;">Export</button>
        </div>
        <div id="exportResult" style="margin-top:8px;"></div>`;

    document.getElementById("generateModal").style.display = "block";
}

function closeGenerate() {
    document.getElementById("generateModal").style.display = "none";
}

function fmtTime(secs) {
    return Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
}

function showSongList(songs, containerId, summary) {
    const c = document.getElementById(containerId);
    if (!songs.length) { c.innerHTML = "<p style='color:#aaa;'>No songs found.</p>"; return; }
    let html = `<p style='color:#aaa;font-size:13px;'>${summary}</p><ul style='list-style:none;padding:0;margin:0;'>`;
    songs.forEach(s => {
        html += `<li style='padding:5px 0;border-bottom:1px solid #333;font-size:14px;'>${s.title} &mdash; ${s.artist} <span style='color:#aaa;float:right;'>${fmtTime(s.length)}</span></li>`;
    });
    html += "</ul>";
    c.innerHTML = html;
}

function generateByTime() {
    const mins = document.getElementById("genMinutes").value;
    fetch("/api/playlist/generate-by-time", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ time_limit: mins })
    })
    .then(r => r.json())
    .then(data => showSongList(data.playlist, "timeResult",
        data.playlist.length + " song(s) | Total: " + fmtTime(data.total_length)));
}

function generateByGenre() {
    const genre = document.getElementById("genGenre").value;
    if (!genre) { alert("Please select a genre"); return; }
    fetch("/api/playlist/generate-by-genre", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ genre })
    })
    .then(r => r.json())
    .then(data => showSongList(data.playlist, "genreResult",
        data.playlist.length + ' song(s) in "' + genre + '"'));
}

function exportArtist() {
    const artist = document.getElementById("genArtist").value.trim();
    if (!artist) { alert("Please enter an artist name"); return; }
    fetch("/api/export-artist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artist })
    })
    .then(r => {
        if (r.ok) return r.json();
        return r.json().then(e => { throw new Error(e.error); });
    })
    .then(data => {
        const a = document.createElement("a");
        a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(data.content);
        a.download = data.filename;
        a.click();
        document.getElementById("exportResult").textContent = "Downloaded: " + data.filename;
    })
    .catch(err => {
        document.getElementById("exportResult").textContent = "Error: " + err.message;
    });
}


renderTracks();

</script>

</body>
</html>
